name: QMOOSA RSI & REA Quality Gate
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi-rea-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run REA Structural Inspector
        run: python3 scripts/rea_inspector.py
      - name: Run Raven RSI Autonomic Engine
        run: python3 scripts/rsi_engine.py